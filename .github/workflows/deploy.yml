name: Deploy to Cloudflare Workers

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run deploy` = opennextjs-cloudflare build && npm run db:init && opennextjs-cloudflare deploy
      # (db:init is idempotent: init.sql uses CREATE TABLE IF NOT EXISTS)
      - name: Build and deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
