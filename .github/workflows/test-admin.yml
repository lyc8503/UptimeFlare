name: Test maintenance admin

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run test:admin
      - run: npx tsc --noEmit -p worker/tsconfig.json
      - run: npm run build
